# cargo-about's settings for THIRD-PARTY-LICENSES.txt (`make third-party`): the notices of every
# crate compiled into a shipped binary, on any of the release's targets. Build scripts' and
# tests' dependencies are not in a binary, so not listed. The workspace's own crates are
# duscape's (LICENSE), so not listed either. A crate under a licence missing here fails the
# generation, as cargo deny fails the build: add the licence after reading it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
