[package]
name = "diskonaut-angch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true

# The program lives in the library; the two binaries are thin shims that call `run()`. The fork's
# own binary carries its name, and `diskonaut` stays as an alias so the old command, the docs, and
# the benchmark recipes keep working. Both run the same program.
[lib]
name = "diskonaut_angch"
path = "src/lib.rs"

[[bin]]
name = "diskonaut-angch"
path = "src/main.rs"

[[bin]]
name = "diskonaut"
path = "src/bin/diskonaut.rs"

[features]
default = []

[dependencies]
clap = { workspace = true }
libdiskonaut = { workspace = true }
dua-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }

# The static musl release needs its own allocator. On the 4.2M-entry benchmark musl's malloc makes
# the scan 7x slower than glibc's, and mimalloc still 2x (both in kernel time); jemalloc matches
# glibc. glibc builds keep the system allocator. 32-bit musl is left alone, as ripgrep does.
[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies]
tikv-jemallocator = { version = "0.6", default-features = false }
