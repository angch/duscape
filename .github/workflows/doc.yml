name: doc

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Each platform's docs, all from Linux: a module of one platform is compiled, and documented,
  # on that platform alone, so a doc comment that links another platform's module — or a private
  # item — only fails where it is documented. Docs name their own platform's modules through
  # `cfg_attr(target_os = …, doc = …)` lines (scanners/src/lib.rs, cache.rs).
  doc:
    name: doc (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Doc
        run: cargo doc --workspace --no-deps --all-features --target ${{ matrix.target }}
        env:
          RUSTDOCFLAGS: -D warnings
