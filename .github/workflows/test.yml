name: Test and coverage

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The release binary is static musl (see deploy.yml); keep it building and passing between tags.
  test-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build cache
        uses: Swatinem/rust-cache@v2
      - name: Run tests (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo test -p libduscape -p duscape-scan -p duscape -p duscape-viewer -p duscape-linux --target x86_64-unknown-linux-musl

  test-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Build cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests (default features)
        run: cargo test --workspace --verbose
      - name: Run tests (--all-features)
        run: cargo test --workspace --all-features --verbose
      - name: Run tests (--no-default-features)
        run: cargo test --workspace --no-default-features --verbose
      - name: Generate coverage report (libduscape)
        run: |
          cargo llvm-cov --all-features -p libduscape --lcov --output-path lcov-libduscape.info
      - name: Generate coverage report (duscape-scan)
        run: |
          cargo llvm-cov --all-features -p duscape-scan --lcov --output-path lcov-duscape-scan.info
      - name: Generate coverage report (duscape)
        run: |
          cargo llvm-cov --all-features -p duscape --lcov --output-path lcov-duscape.info
      - name: Upload libduscape coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov-libduscape.info
          flags: libduscape
          name: libduscape
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload duscape-scan coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov-duscape-scan.info
          flags: duscape-scan
          name: duscape-scan
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload duscape coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov-duscape.info
          flags: duscape
          name: duscape
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
