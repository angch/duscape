[default.extend-words]
ratatui = "ratatui"
# The NFS export tool, `exportfs(8)`.
exportfs = "exportfs"
# PNG's Paeth filter, after Alan W. Paeth
paeth = "paeth"
# xkb's name for the Again key (`xkb_keycodes`), in the Linux viewer's test keymap.
AGAI = "AGAI"

[default.extend-identifiers]
# Win32's `ExtTextOutW` option, in the Windows viewer's painting.
ETO_CLIPPED = "ETO_CLIPPED"

[files]
# THIRD-PARTY-LICENSES.txt is generated (`make third-party`): crate names and others' notices,
# kept as their authors wrote them.
extend-exclude = ["trayd/", "target/", "**/*.snap", "THIRD-PARTY-LICENSES.txt"]
