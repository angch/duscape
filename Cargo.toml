[workspace]
members = [
    "common",
    "scanners",
    "viewers/tui",
    "viewers/windows",
    "viewers/macos",
    "viewers/shared",
    "viewers/linux",
]
resolver = "3"

# Small binaries are a feature of this fork: optimize release for size. `panic = "abort"` drops the
# unwinding tables; the CLI stays safe because its terminal is restored by a panic hook, not only by
# unwinding a drop guard (see `viewers/tui/src/lib.rs`).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Size and complexity limits, measured by clippy on every crate; thresholds in clippy.toml.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ang Chin Han <ang.chin.han@gmail.com>"]
homepage = "https://github.com/angch/diskonaut"
description = "Performance-focused, multi-platform fork of the diskonaut disk-usage navigator"
repository = "https://github.com/angch/diskonaut"
# Own 0.x line: this fork diverged from upstream diskonaut 0.13.0 and versions independently.
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dua-core = "4"
libc = "0.2"
libdiskonaut = { path = "common", version = "0.1.0" }
diskonaut-scan = { path = "scanners", version = "0.1.0" }
windows-sys = "0.59"
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The release build with symbols kept and line tables, for profilers (`--profile profiling`).
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
