[workspace]
members = [
    "common",
    "scanners",
    "viewers/tui",
    "viewers/windows",
    "viewers/macos",
    "viewers/shared",
    "viewers/linux",
]
resolver = "3"

# Small binaries are a feature of this fork: optimize release for size. `panic = "abort"` drops the
# unwinding tables; the CLI stays safe because its terminal is restored by a panic hook, not only by
# unwinding a drop guard (see `viewers/tui/src/lib.rs`).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Size and complexity limits, measured by clippy on every crate; thresholds in clippy.toml.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Ang Chin Han <ang.chin.han@gmail.com>"]
homepage = "https://github.com/angch/duscape"
description = "Performance-focused, multi-platform fork of the diskonaut disk-usage navigator"
repository = "https://github.com/angch/duscape"
# Own 0.x line: this fork diverged from upstream diskonaut 0.13.0 and versions independently.
version = "0.3.0-rc.8"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
libduscape = { path = "common", version = "0.3.0-rc.8" }
duscape-scan = { path = "scanners", version = "0.3.0-rc.8" }
windows-sys = "0.59"
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"
# The picture formats a preview decodes (`libduscape::preview`), measured on the Windows window
# (2026-10-06): PNG, JPEG and WebP 1.68 MB; with the formats `image` holds itself (BMP, ICO, HDR,
# PNM, DDS) +104 KB; with QOI, GIF and TIFF +344 KB. Left out: OpenEXR (+442 KB more, a niche
# whose files are mostly too large to preview), AVIF (`image`'s `avif` encodes only; decoding
# is `avif-native`, libdav1d in C, for every static target) and TGA (no magic bytes to know it
# by). Every crate here is in Debian.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "ico",
    "tiff",
    "qoi",
    "hdr",
    "pnm",
    "dds",
] }
flate2 = "1"

# The release build with symbols kept and line tables, for profilers (`--profile profiling`).
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
