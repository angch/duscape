# DOSBox-X for diskonaut: this repository as C:, long file names on. `make dos-run` starts it
# from the repository root; run it as `dosbox-x -conf viewers/dos/dosbox-x.conf` from there.

[dosbox]
title  = diskonaut
memsize = 16

[cpu]
cputype = pentium
cycles  = max

[dos]
ver = 7.1
lfn = true

[autoexec]
mount c .
c:
C:\TARGET\DOS\DISKONAUT C:\
