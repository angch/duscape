[package]
name = "duscape-mac"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "macOS GUI viewer for duscape: the shared model and native walker, drawn with AppKit."

[lints]
workspace = true

[[bin]]
name = "duscape-mac"
path = "src/main.rs"

[dependencies]
libduscape = { workspace = true }
duscape-scan = { workspace = true }
duscape-viewer = { path = "../shared", version = "0.2.0" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"
objc2-quick-look-ui = "0.3"
