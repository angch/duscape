# Example duscape config. Copy to:
#   ~/.config/duscape/config.toml
# or pass: duscape -c /path/to/config.toml

version = 1

[base]
# Use logical file size instead of on-disk block usage (same as `-a` / `--apparent-size`).
apparent-size = false

[keybinds]
# Single-character keys, special names (enter, escape, left, …), or modifiers (ctrl+c).
# Arrow keys and Ctrl+f/b/n/p remain available for movement unless you remap the vim keys below.

quit = "q"
delete = "d"
move-left = "h"
move-right = "l"
move-up = "k"
move-down = "j"
enter = "enter"
parent = "escape"
zoom-in = "+"
zoom-out = "-"
reset-zoom = "0"
confirm = "y"
cancel = "n"
# Move the arrow keys between the list on the left and the treemap on the right.
switch-panel = "tab"
# Scan the selected folder again (the shown folder when a file is selected), or everything.
rescan = "r"
rescan-all = "R"
# Switch between space used on disk and apparent size (file lengths); no rescan needed.
toggle-size = "a"
